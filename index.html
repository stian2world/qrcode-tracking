<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QR Routes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <header id="topbar">
    <button id="pref-button" type="button" aria-label="Change preference" title="Tap to change preference">✨ Recommended</button>
    <div id="camera-controls">
      <select id="camera-select" aria-label="Camera" hidden></select>
      <button id="flip-button" type="button" aria-label="Switch front / back camera" title="Switch camera" hidden>🔄</button>
    </div>
  </header>
  <p id="hint" role="status" hidden></p>

  <aside id="popup" role="dialog" aria-live="polite" aria-labelledby="popup-title" hidden>
    <div class="popup-head">
      <h2 id="popup-title"></h2>
      <div class="popup-buttons">
        <button id="speak-button" type="button" aria-label="Read it again">▶︎</button>
        <button id="mute-button" type="button" aria-label="Mute voice">🔊</button>
      </div>
    </div>
    <div id="popup-best"></div>
    <ul id="popup-list"></ul>
    <p id="popup-source"></p>
  </aside>

  <div id="start">
    <h1>QR Routes</h1>
    <p>Hold the 🧭 transport code between two places to hear how to get there.</p>
    <button id="start-button" type="button">Start camera &amp; voice 🔊</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
